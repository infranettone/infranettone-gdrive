name: Build and upload release (macos)

on:
  release:
    types: [created]

permissions:
  contents: write

env:
  APP_NAME: gdrive
  ARCHIVE_NAME: gdrive_macos-x64.tar.gz

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      # `-p gdrive` keeps this to the CLI: the workspace also holds the desktop
      # app, which is released by release_ui.yaml instead.
      - name: Build application
        run: |
          cargo build --release -p gdrive --target x86_64-apple-darwin
          tar -czf $ARCHIVE_NAME -C target/x86_64-apple-darwin/release $APP_NAME

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE_NAME }}
