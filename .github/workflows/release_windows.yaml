name: Build and upload release (windows)

on:
  release:
    types: [created]

permissions:
  contents: write

env:
  APP_NAME: gdrive
  ARCHIVE_NAME: gdrive_windows-x64.zip

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # `-p gdrive` keeps this to the CLI: the workspace also holds the desktop
      # app, which is released by release_ui.yaml instead.
      - name: Build application
        run: |
          cargo build --release -p gdrive
          cd target/release
          7z a -tzip $ARCHIVE_NAME $APP_NAME.exe
          mv $ARCHIVE_NAME ../../
        shell: bash

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE_NAME }}
