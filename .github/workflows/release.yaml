name: Release

# Publishing is a version bump: set [workspace.package] version in the root
# Cargo.toml and merge to main. This tags v<version>, builds every artifact
# and publishes the release. It does nothing once that version is published,
# so ordinary pushes to main are a no-op — and a run that failed part way can
# simply be re-run.
#
# Linux only for now. The macOS and Windows builds were dropped to keep
# releases fast; see "Other platforms" in the README to bring them back.
on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      should_release: ${{ steps.check.outputs.should_release }}

    steps:
      - uses: actions/checkout@v4

      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version = "\(.*\)"$/\1/p' | head -1)"

          if [ -z "$version" ]; then
            echo "Could not read the version from [workspace.package] in Cargo.toml" >&2
            exit 1
          fi

          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # The gate is a *published* release, not the tag: a run that failed
          # half way leaves the tag and a draft behind, and re-running it has
          # to be able to finish the job.
          draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)"

          if [ "$draft" = "false" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag is already published, nothing to release."
          elif [ "$draft" = "true" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Resuming the unfinished draft release for $tag."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing $tag."
          fi

  create-release:
    name: Create draft release
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}

    steps:
      - uses: actions/checkout@v4

      # Created as a draft so the release only becomes visible once every
      # artifact has uploaded successfully. Every step is idempotent, so a
      # re-run after a failed build picks up where it left off.
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          # A draft has no tag until it is published, so create it ourselves
          # first.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

          # Drafts are invisible to `GET /releases/tags/{tag}`, so an existing
          # one can only be found by listing releases.
          find_draft() {
            gh api "repos/$GITHUB_REPOSITORY/releases" \
              --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1
          }

          release_id="$(find_draft)"

          if [ -n "$release_id" ]; then
            echo "Draft release for $TAG already exists."
          else
            # Create through the API rather than `gh release create`: the
            # response carries the id. Listing straight after creating is
            # eventually consistent and can miss the new draft, which is what
            # failed the first 3.10.0 run.
            release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" \
              -f name="$TAG" \
              -F draft=true \
              -F generate_release_notes=true \
              --jq .id)"
          fi

          if [ -z "$release_id" ]; then
            echo "Could not resolve the release id for $TAG" >&2
            exit 1
          fi

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  cli:
    name: CLI (Linux x64)
    needs: [prepare, create-release]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # `-p gdrive` keeps this to the CLI: the workspace also holds the
      # desktop app, which the `desktop` job builds instead. musl makes the
      # binary fully static, so it runs on any distro regardless of glibc.
      - name: Build (static musl)
        run: |
          docker run --rm -t \
            -v "$HOME/.cargo/registry/:/root/.cargo/registry" \
            -v "$(pwd)":/volume \
            clux/muslrust:stable cargo build --release -p gdrive
          tar -czf gdrive_linux-x64.tar.gz -C target/x86_64-unknown-linux-musl/release gdrive

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.prepare.outputs.tag }}" gdrive_linux-x64.tar.gz --clobber

  desktop:
    name: Desktop app (Linux x64)
    needs: [prepare, create-release]
    # AppImage, .deb and .rpm. Built on 22.04 so the glibc floor stays low.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gdrive-ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            libxdo-dev

      - name: Install frontend dependencies
        working-directory: gdrive-ui
        run: npm ci

      # The bundle ships the CLI as a Tauri sidecar, so installing the app
      # also installs `gdrive`. With no triple the script builds into the same
      # target/release/ as the app, so `tauri build` reuses these dependencies
      # instead of compiling them a second time.
      - name: Build the CLI sidecar
        working-directory: gdrive-ui
        run: npm run sidecar

      # Updater signing is optional, but it cannot be wired straight into the
      # env below: an unset secret expands to an empty string and the variable
      # is still *defined*, which makes Tauri try to use an empty key and fail.
      # So only promote the ones that actually have a value.
      - name: Configure optional updater signing
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            value="${!name}"
            if [ -n "$value" ]; then
              # Delimiter form, so a multi-line secret survives intact.
              {
                echo "$name<<__GDRIVE_SECRET_EOF__"
                echo "$value"
                echo "__GDRIVE_SECRET_EOF__"
              } >> "$GITHUB_ENV"
              echo "$name is set."
            fi
          done

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: gdrive-ui
          releaseId: ${{ needs.create-release.outputs.release_id }}

  publish:
    name: Publish release
    needs: [prepare, create-release, cli, desktop]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Undraft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.prepare.outputs.tag }}" --draft=false --latest
          echo "::notice::Published ${{ needs.prepare.outputs.tag }}."
