name: Release

# Publishing is a version bump: set [workspace.package] version in the root
# Cargo.toml and merge to main. This tags v<version>, builds every artifact
# and publishes the release. It does nothing once that version is published,
# so ordinary pushes to main are a no-op — and a run that failed part way can
# simply be re-run.
on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      should_release: ${{ steps.check.outputs.should_release }}

    steps:
      - uses: actions/checkout@v4

      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version = "\(.*\)"$/\1/p' | head -1)"

          if [ -z "$version" ]; then
            echo "Could not read the version from [workspace.package] in Cargo.toml" >&2
            exit 1
          fi

          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # The gate is a *published* release, not the tag: a run that failed
          # half way leaves the tag and a draft behind, and re-running it has
          # to be able to finish the job.
          draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)"

          if [ "$draft" = "false" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag is already published, nothing to release."
          elif [ "$draft" = "true" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Resuming the unfinished draft release for $tag."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing $tag."
          fi

  create-release:
    name: Create draft release
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}

    steps:
      - uses: actions/checkout@v4

      # Created as a draft so the release only becomes visible once every
      # platform has uploaded successfully. Every step is idempotent, so a
      # re-run after a failed build picks up where it left off.
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          # `gh release create --draft` does NOT create the tag — a draft has
          # no tag until it is published — so create it ourselves first.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Draft release for $TAG already exists."
          else
            gh release create "$TAG" --draft --title "$TAG" --generate-notes
          fi

          # Drafts are invisible to `GET /releases/tags/{tag}`, so find the id
          # by listing releases, which does include them.
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)"

          if [ -z "$release_id" ]; then
            echo "Could not resolve the release id for $TAG" >&2
            exit 1
          fi

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  cli:
    name: CLI (${{ matrix.label }})
    needs: [prepare, create-release]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux x64
            archive: gdrive_linux-x64.tar.gz
          - os: macos-latest
            label: macOS x64
            archive: gdrive_macos-x64.tar.gz
          - os: windows-latest
            label: Windows x64
            archive: gdrive_windows-x64.zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.os != 'ubuntu-latest'
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'x86_64-apple-darwin' || '' }}

      # `-p gdrive` keeps this to the CLI: the workspace also holds the
      # desktop app, which the `desktop` job builds instead.
      - name: Build (Linux, static musl)
        if: matrix.os == 'ubuntu-latest'
        run: |
          docker run --rm -t \
            -v "$HOME/.cargo/registry/:/root/.cargo/registry" \
            -v "$(pwd)":/volume \
            clux/muslrust:stable cargo build --release -p gdrive
          tar -czf "${{ matrix.archive }}" -C target/x86_64-unknown-linux-musl/release gdrive

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cargo build --release -p gdrive --target x86_64-apple-darwin
          tar -czf "${{ matrix.archive }}" -C target/x86_64-apple-darwin/release gdrive

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cargo build --release -p gdrive
          7z a -tzip "${{ matrix.archive }}" ./target/release/gdrive.exe

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${{ needs.prepare.outputs.tag }}" "${{ matrix.archive }}" --clobber

  desktop:
    name: Desktop app (${{ matrix.label }})
    needs: [prepare, create-release]
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # AppImage, .deb and .rpm. Built on 22.04 so the glibc floor stays low.
          - platform: ubuntu-22.04
            label: Linux x64
            args: ""
            target: ""
          # Both macOS builds run on Apple Silicon and the Intel one
          # cross-compiles: GitHub has retired its Intel (macos-13) runners, so
          # a job asking for one waits forever.
          - platform: macos-14
            label: macOS arm64
            args: "--target aarch64-apple-darwin"
            target: aarch64-apple-darwin
          - platform: macos-14
            label: macOS x64
            args: "--target x86_64-apple-darwin"
            target: x86_64-apple-darwin
          # .msi and an NSIS .exe installer.
          - platform: windows-latest
            label: Windows x64
            args: ""
            target: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gdrive-ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            libxdo-dev

      - name: Install frontend dependencies
        working-directory: gdrive-ui
        run: npm ci

      # Signing is optional, but it cannot be wired straight into the env
      # below: an unset secret expands to an empty string and the variable is
      # still *defined*, which makes Tauri try to import an empty certificate
      # and fail. So only promote the ones that actually have a value.
      - name: Configure optional code signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          do
            value="${!name}"
            if [ -n "$value" ]; then
              # Delimiter form, so a multi-line secret (a PEM key, a wrapped
              # base64 blob) survives intact.
              {
                echo "$name<<__GDRIVE_SECRET_EOF__"
                echo "$value"
                echo "__GDRIVE_SECRET_EOF__"
              } >> "$GITHUB_ENV"
              echo "$name is set."
            fi
          done

          if [ -z "${APPLE_CERTIFICATE}" ]; then
            echo "::notice::No Apple signing secrets configured; the bundle will be unsigned."
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: gdrive-ui
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  publish:
    name: Publish release
    needs: [prepare, create-release, cli, desktop]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Undraft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.prepare.outputs.tag }}" --draft=false --latest
          echo "::notice::Published ${{ needs.prepare.outputs.tag }}."
