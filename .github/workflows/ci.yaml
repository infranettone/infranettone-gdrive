name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Linux only for now. The macOS and Windows jobs were dropped to keep the
# pipeline fast; see "Other platforms" in the README to bring them back.
jobs:
  cli:
    name: CLI
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      # No separate `cargo build`: clippy --all-targets and the test build
      # between them already compile every target.
      - name: Clippy
        run: cargo clippy -p gdrive --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test -p gdrive --locked

  frontend:
    name: Frontend
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: gdrive-ui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gdrive-ui/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  desktop:
    name: Desktop app
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gdrive-ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            libxdo-dev

      # `tauri::generate_context!` reads the built frontend, so dist/ must
      # exist before the Rust side compiles.
      - name: Build frontend
        working-directory: gdrive-ui
        run: |
          npm ci
          npm run build

      # `tauri-build` refuses to compile when an `externalBin` is missing. This
      # job only checks and tests — it never bundles or runs the sidecar — so
      # an empty placeholder is enough, and it saves a full release build of
      # the CLI. The release workflow builds the real one.
      - name: Stub the CLI sidecar
        run: |
          mkdir -p gdrive-ui/src-tauri/binaries
          touch "gdrive-ui/src-tauri/binaries/gdrive-$(rustc -vV | sed -n 's/^host: //p')"

      - name: Check
        run: cargo clippy -p gdrive-ui --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test -p gdrive-ui --locked
