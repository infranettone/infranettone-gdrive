name: Build and upload release (linux)

on:
  release:
    types: [created]

permissions:
  contents: write

env:
  APP_NAME: gdrive
  ARCHIVE_NAME: gdrive_linux-x64.tar.gz

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `-p gdrive` keeps this to the CLI: the workspace also holds the desktop
      # app, which needs a system webview and a node toolchain.
      - name: Build application
        run: |
          docker run --rm -t -v $HOME/.cargo/registry/:/root/.cargo/registry -v "$(pwd)":/volume clux/muslrust:stable cargo build --release -p gdrive

      - name: Create archive
        run: |
          tar -czf $ARCHIVE_NAME -C target/x86_64-unknown-linux-musl/release $APP_NAME

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE_NAME }}
